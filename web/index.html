<!DOCTYPE html>
<html>
<head>
    <title>Personal Profile Form</title>

    <style>
    body{
    font-family: 'Segoe UI', sans-serif;

    background-image: url("images/backgroundduck.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    margin:0;
    padding:0;
    }

    .container{
    width:500px;
    margin:40px auto;

    background: rgba(255,255,255,0.92);

    padding:30px;

    border-radius:20px;

    box-shadow: 0px 0px 20px rgba(255,182,193,0.8);
    }

    h2{
    text-align:center;
    color:#d87093;
    }

    label{
    color:#c71585;
    font-weight:bold;
    }

    input, textarea{
    width:100%;
    padding:10px;

    border:2px solid #ffd1dc;
    border-radius:10px;

    margin-top:5px;
    margin-bottom:15px;

    background:#fffafb;
    }

    textarea{
    height:100px;
    }

    button{
    width:100%;
    padding:12px;

    border:none;
    border-radius:10px;

    background:#ffb6c1;
    color:white;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;
    }

    button:hover{
    background:#ff8fab;
    }
    </style>
</head>

<body>

<div class="container">

    <div style="text-align:center;">
    <img src="images/logocat.png"
         width="100">
    </div>
    
<h2> Personal Profile </h2>

<form action="ProfileServlet" method="post">

<label>Name</label>
<input type="text" name="name">

<label>Student ID</label>
<input type="text" name="studentid">

<label>Programme</label>
<input type="text" name="programme">

<label>Email</label>
<input type="email" name="email">

<label>Hobbies</label>
<input type="text" name="hobbies">

<label>Short Self Introduction</label>
<textarea name="intro"></textarea>

<button type="submit">
Submit
</button>

</form>

</div>

</body>
</html>
